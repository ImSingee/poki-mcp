<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone screen</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#ffffff, #17181a));
    --bg-2: var(--color-background-secondary, light-dark(#f4f5f7, #212327));
    --text: var(--color-text-primary, light-dark(#17181a, #ececee));
    --text-2: var(--color-text-secondary, light-dark(#5b5f66, #a3a7ae));
    --border: var(--color-border-primary, light-dark(#e3e5e8, #34373c));
    --accent: var(--color-text-info, light-dark(#1f6feb, #5ea0ff));
    --warn: var(--color-text-warning, light-dark(#9a6700, #d9a43a));
    --danger: var(--color-text-danger, light-dark(#cf222e, #ff7b72));
    --radius: var(--border-radius-md, 10px);
    --radius-sm: var(--border-radius-sm, 6px);
    --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
    --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: transparent; }
  body { font: 13px/1.4 var(--font); color: var(--text); }
  main { display: grid; gap: 8px; padding: 10px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .bar .grow { flex: 1; min-width: 0; }
  select, button { font: inherit; color: var(--text); background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; min-height: 30px; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  select { max-width: 100%; }
  .stage { position: relative; justify-self: center; width: 100%; max-width: 520px; background: #000; border-radius: 18px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: auto; outline: none; cursor: crosshair; }
  canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  /* Below the picture, never over it: the phone's status bar is part of what the person watches. */
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 8px; justify-self: center; width: 100%; max-width: 520px; }
  .meta .hint { flex: 1 1 240px; }
  .stats { margin-left: auto; color: var(--text-2); font: 11px/1.3 var(--mono); white-space: nowrap; }
  .notice { position: absolute; inset: auto 8px 8px 8px; padding: 8px 10px; border-radius: var(--radius-sm); background: rgba(0,0,0,.72); color: #fff; font-size: 12px; }
  .notice button { margin-left: 6px; color: #fff; background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.3); }
  .placeholder { aspect-ratio: 9 / 19.5; display: grid; place-items: center; color: #9aa0a6; padding: 16px; text-align: center; }
  .hint { color: var(--text-2); font-size: 12px; }
  .error { color: var(--danger); font-size: 12px; white-space: pre-wrap; }
  dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); max-width: 320px; }
  dialog p { margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <select id="device" class="grow" aria-label="iPhone"></select>
    <button id="home" title="Home" aria-label="Home">Home</button>
    <button id="lock" title="Lock" aria-label="Lock">Lock</button>
    <button id="takeover" hidden>Take over</button>
  </div>
  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">Connecting…</div>
    <canvas id="screen" tabindex="0" hidden aria-label="iPhone screen. Click to tap, drag to swipe, type to send keys."></canvas>
    <div class="notice" id="notice" hidden></div>
  </div>
  <div class="meta">
    <div class="hint" id="hint">Click to tap, hold to long-press, drag to swipe, two fingers to pinch. Focus the screen and type to send keys.</div>
    <div class="stats" id="stats" hidden></div>
  </div>
  <div class="error" id="error" hidden></div>
</main>
<dialog id="confirm">
  <p id="confirm-text">The agent is using this iPhone. Taking over stops what it is doing on this iPhone, and it cannot use the iPhone while you control it.</p>
  <div class="bar"><button id="confirm-yes" class="primary">Take over</button><button id="confirm-no">Cancel</button></div>
</dialog>

  const moved = Math.hypot(last.x - first.x, last.y - first.y) * Math.max(canvas.clientWidth || 390, 1);
  if (moved < 8) return duration >= 500 ? { kind: 'long_press', x: first.x, y: first.y, t_ms: duration } : { kind: 'tap', x: first.x, y: first.y, t_ms: duration };
  return { kind: duration <= 300 ? 'swipe' : 'drag', x: first.x, y: first.y, x2: last.x, y2: last.y, t_ms: duration };
};
const pointers = new Map();
canvas.addEventListener('pointerdown', event => {
  pointers.set(event.pointerId, [{ ...position(event), t: performance.now() }]);
  event.preventDefault();
  canvas.focus({ preventScroll: true });
  // Keeps the gesture when it leaves the canvas; not every host's frame allows it.
  try { canvas.setPointerCapture(event.pointerId); } catch {}
});
canvas.addEventListener('pointermove', event => { pointers.get(event.pointerId)?.push({ ...position(event), t: performance.now() }); });
const finish = event => {
  const points = pointers.get(event.pointerId);
  if (!points) return;
  points.push({ ...position(event), t: performance.now() });
  pointers.delete(event.pointerId);
  // The first finger to lift ends a two-finger gesture; the other's path makes it a pinch.
  const [other] = pointers.values();
  if (other) { pointers.clear(); sendInput(globalThis.pokiGesture(points, other)); return; }
  sendInput(globalThis.pokiGesture(points));
};
canvas.addEventListener('pointerup', finish);
canvas.addEventListener('pointercancel', event => pointers.delete(event.pointerId));
canvas.addEventListener('contextmenu', event => event.preventDefault());
// Keys typed while the screen has focus: printable text in one call per burst, special keys alone.
let typed = '', typedTimer;
const special = { Enter: 'return', Backspace: 'backspace', Tab: 'tab', Escape: 'escape', ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Delete: 'forward_delete' };
canvas.addEventListener('keydown', event => {
  if (event.metaKey || event.ctrlKey || event.altKey) {
    if (event.key.length === 1) { sendInput({ kind: 'key', key: event.key.toLowerCase(), modifiers: [event.metaKey && 'command', event.ctrlKey && 'control', event.altKey && 'option', event.shiftKey && 'shift'].filter(Boolean) }); event.preventDefault(); }
    return;
  }
  if (event.key.length === 1) { typed += event.key; clearTimeout(typedTimer); typedTimer = setTimeout(flushTyped, 250); event.preventDefault(); return; }
  if (special[event.key]) { flushTyped(); sendInput({ kind: 'key', key: special[event.key] }); event.preventDefault(); }
});
function flushTyped() { clearTimeout(typedTimer); if (typed) { sendInput({ kind: 'text', text: typed }); typed = ''; } }
$('home').onclick = () => sendInput({ kind: 'button', button: 'home' });
$('lock').onclick = () => sendInput({ kind: 'button', button: 'lock' });

// Taking over interrupts the agent: only after the person confirms.
function askTakeover() { $('confirm').showModal(); }
$('takeover').onclick = askTakeover;
$('confirm-no').onclick = () => $('confirm').close();
$('confirm-yes').onclick = async () => {
  $('confirm').close();
  try { await call('screen_takeover', { stream: state.stream, confirm: true }); $('takeover').hidden = true; notice(''); }
  catch (error) { notice(error.message); }
};

// ---- Devices --------------------------------------------------------------------------------
async function refreshDevices() {
  try {
    const listed = await call('list_devices');
    state.devices = (listed?.devices ?? []).filter(d => d.kind === 'physical');
  } catch (error) { showError(error); }
  const select = $('device');
  select.replaceChildren(...state.devices.map(d => { const option = document.createElement('option'); option.value = d.id; option.textContent = d.name && d.name !== d.id ? `${d.name}` : d.id; return option; }));
  if (!state.device && state.devices.length) state.device = (state.devices.find(d => d.connection === 'RemotePairing') ?? state.devices[0]).id;
  if (state.device) select.value = state.device;
  if (!state.devices.length) { $('placeholder').textContent = 'No iPhone is paired with this computer.'; $('placeholder').hidden = false; }
}
$('device').onchange = () => { state.device = $('device').value; $('takeover').hidden = true; void openStream(); };

// Stats in the corner: transport, codec, frames shown per second, and the last batch's round trip.
setInterval(() => {
  const now = performance.now();
  stats.fps = Math.round(stats.fpsFrames * 1000 / Math.max(1, now - stats.fpsAt)); stats.fpsFrames = 0; stats.fpsAt = now;
  const box = $('stats');
  box.hidden = !state.transport;
  box.textContent = `${state.transport === 'webrtc' ? 'WebRTC' : 'tool calls'} · ${state.codec?.toUpperCase() ?? ''} · ${stats.fps} fps${state.transport === 'webrtc' ? '' : ` · ${stats.latency} ms`}`;
  state.stats = { fps: stats.fps, latency: stats.latency, decoded: stats.decoded, stuck: decoder?.stuck ?? 0, errors: decoder?.errors ?? 0, held: held.length, last: lastSeq };
}, 1000);

app.ontoolresult = params => {
  const value = data(params);
  const device = value?.device;
  if (device && device !== state.device) { state.device = device; $('device').value = device; void openStream(); }
};
app.onhostcontextchanged = context => { applyContext(context); layout(); };
app.onteardown = async () => { state.closed = true; state.generation++; stop(); return {}; };
window.addEventListener('pagehide', () => stop());

try {
  await app.connect(new PostMessageTransport(window.parent, window.parent));
  applyContext(app.getHostContext());
  if (!app.getHostCapabilities()?.serverTools) state.canCall = false;
} catch (error) {
  state.canCall = false;
  showError(new Error(`Could not connect to the host: ${error.message}`));
}
layout();
if (state.canCall) { await refreshDevices(); if (state.device && !state.stream) await openStream(); }
else $('placeholder').textContent = 'This host cannot call Poki tools, so the screen cannot be shown here.';
</script>
</body>
</html>
